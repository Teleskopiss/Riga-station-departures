name: Scrape full route schedule

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scrape-full-route-schedule
  cancel-in-progress: true

jobs:
  scrape:
    name: Run scrape_full_route_schedule
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: scraper/requirements.txt

      - name: Install requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r scraper/requirements.txt

      - name: Run scraper
        run: |
          python scraper/scrape_full_route_schedule.py

      - name: Validate JSON
        run: |
          python -m json.tool docs/full-day-schedule.json > /dev/null

      - name: Verify output exists
        run: |
          test -s docs/full-day-schedule.json

      - name: Commit generated schedule
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add docs/full-day-schedule.json

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Update full route schedule"
          git push